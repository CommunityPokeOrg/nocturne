name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/android/**"
      - "packages/ui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "packages/android/**"
      - "packages/ui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: Build emulator APK
    # macOS runner per project preference; GitHub's macos image ships the
    # Android SDK + NDK (ANDROID_HOME preset), JDK, Rust, and can run Gradle.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        run: bun install --frozen-lockfile

      - name: Build UI bundle
        run: bun run ui:build

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Build APK (bundles nocturned for both ABIs)
        working-directory: packages/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-emulator-debug
          path: packages/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9
          if-no-files-found: error
